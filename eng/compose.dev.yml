services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: stockripper
      POSTGRES_USER: stockripper
      POSTGRES_PASSWORD: ${STOCKRIPPER_DEV_POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:${STOCKRIPPER_DEV_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d stockripper
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql

volumes:
  database:
