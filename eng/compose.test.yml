services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${STOCKRIPPER_TEST_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${STOCKRIPPER_TEST_POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:${STOCKRIPPER_TEST_POSTGRES_PORT:?required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql

volumes:
  database:
